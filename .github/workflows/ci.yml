# Based on the starter template from :
# https://github.com/actions/starter-workflows/blob/cd4b67d/ci/blank.yml

# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    # Inspired by https://github.com/xu-cheng/latex-action#example
    steps:
        # Clone the repository onto the runner so the workflow can access the source files
        - name: Set up GitHub repository
          uses: actions/checkout@v6
        # Compile cv.tex into cv.pdf using a containerized TeX Live environment
        - name: Compile LaTeX document
          uses: xu-cheng/latex-action@v4
          with:
            root_file: cv.tex
        # Save the generated PDF as a downloadable build artifact in the Actions summary
        - name: Upload PDF file
          uses: actions/upload-artifact@v6
          with:
            name: PDF
            path: cv.pdf